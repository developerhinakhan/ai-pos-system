<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS System — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0F1E;
      color: #E8EDF5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .login-box {
      background: #111827;
      border: 1px solid #1E2A3A;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.4rem;
    }
    .sub {
      color: #93A0B3;
      font-size: 0.9rem;
      margin-bottom: 1.75rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #93A0B3;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #1E2A3A;
      background: #0A0F1E;
      color: #E8EDF5;
      font-size: 0.95rem;
      margin-bottom: 1.1rem;
    }
    input:focus {
      outline: none;
      border-color: #00D4FF;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      background: #00D4FF;
      color: #0A0F1E;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #message {
      margin-top: 1rem;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2rem;
    }
    .error { color: #FF6B6B; }
    .success { color: #00FF88; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>POS System</h1>
    <p class="sub">Sign in to manage your store</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" required />

      <button type="submit" id="submitBtn">Log In</button>
    </form>

    <div id="message"></div>

    <p style="text-align:center; margin-top:1.25rem; font-size:0.85rem; color:#93A0B3;">
      Don't have an account? <a href="signup.html" style="color:#00D4FF; text-decoration:none;">Sign up</a>
    </p>
  </div>

  <script>
    // ⚠️ Update this to match your live Railway backend URL
    const API_BASE = "https://ai-pos-system-production-8ee2.up.railway.app";

    const form = document.getElementById("loginForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.textContent = "Logging in...";
      messageEl.textContent = "";
      messageEl.className = "";

      try {
        // FastAPI's OAuth2PasswordRequestForm expects form-encoded data, not JSON
        const formData = new URLSearchParams();
        formData.append("username", username);
        formData.append("password", password);

        const response = await fetch(`${API_BASE}/auth/login`, {
          method: "POST",
          headers: {
            "Content-Type": "application/x-www-form-urlencoded"
          },
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Login failed");
        }

        // Save the token so other pages can use it
        localStorage.setItem("pos_token", data.access_token);

        messageEl.textContent = "Login successful! Redirecting...";
        messageEl.className = "success";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);

      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = "error";
        submitBtn.disabled = false;
        submitBtn.textContent = "Log In";
      }
    });
  </script>
</body>
</html>
