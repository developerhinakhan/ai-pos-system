<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS System — Categories</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0F1E;
      color: #E8EDF5;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container { max-width: 900px; margin: 0 auto; }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    nav a {
      color: #93A0B3;
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid #1E2A3A;
      border-radius: 8px;
    }
    nav a:hover { color: #00D4FF; border-color: #00D4FF; }
    nav a.active { color: #00D4FF; border-color: #00D4FF; background: #00D4FF11; }

    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }

    .card {
      background: #111827;
      border: 1px solid #1E2A3A;
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #93A0B3;
      margin-bottom: 0.35rem;
    }
    input {
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid #1E2A3A;
      background: #0A0F1E;
      color: #E8EDF5;
      font-size: 0.9rem;
    }
    input:focus { outline: none; border-color: #00D4FF; }

    button {
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      border: none;
      background: #00D4FF;
      color: #0A0F1E;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid #1E2A3A;
      font-size: 0.88rem;
    }
    th { color: #93A0B3; font-weight: 500; font-size: 0.78rem; text-transform: uppercase; }

    .edit-btn {
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid #00D4FF;
      background: transparent;
      color: #00D4FF;
      cursor: pointer;
      margin-right: 0.4rem;
    }
    .edit-btn:hover { background: #00D4FF11; }
    .danger {
      background: transparent;
      border: 1px solid #FF6B6B;
      color: #FF6B6B;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .danger:hover { background: #FF6B6B11; }

    #message { margin-top: 0.75rem; font-size: 0.85rem; }
    .error { color: #FF6B6B; }
    .success { color: #00FF88; }
    .muted { color: #93A0B3; font-size: 0.85rem; padding: 1rem 0; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #111827;
      border: 1px solid #1E2A3A;
      border-radius: 14px;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h2 { margin-bottom: 1rem; }
    .modal-actions { display: flex; gap: 0.75rem; margin-top: 0.5rem; }
    .modal-actions button.secondary {
      background: transparent;
      border: 1px solid #1E2A3A;
      color: #E8EDF5;
    }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div style="font-weight:700;">POS System</div>
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <a href="products.html">Products</a>
        <a href="categories.html" class="active">Categories</a>
        <a href="customers.html">Customers</a>
        <a href="sale.html">Make Sale</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="#" id="logoutLink">Logout</a>
      </div>
    </nav>

    <h1>Categories</h1>

    <div class="card">
      <h2>Add New Category</h2>
      <form id="categoryForm">
        <div class="form-grid">
          <div>
            <label>Name</label>
            <input type="text" id="name" required />
          </div>
          <div>
            <label>Description (optional)</label>
            <input type="text" id="description" />
          </div>
        </div>
        <button type="submit" id="submitBtn">Add Category</button>
        <div id="message"></div>
      </form>
    </div>

    <div class="card">
      <h2>Current Categories</h2>
      <div id="categoriesTableWrap">
        <p class="muted">Loading categories...</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h2>Edit Category</h2>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div>
            <label>Name</label>
            <input type="text" id="editName" required />
          </div>
          <div>
            <label>Description</label>
            <input type="text" id="editDescription" />
          </div>
        </div>
        <div id="editMessage" style="margin-bottom:0.75rem;"></div>
        <div class="modal-actions">
          <button type="submit" id="editSubmitBtn">Save Changes</button>
          <button type="button" class="secondary" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = "https://ai-pos-system-production-8ee2.up.railway.app";
    const token = localStorage.getItem("pos_token");

    if (!token) {
      window.location.href = "login.html";
    }

    const authHeaders = {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json"
    };

    document.getElementById("logoutLink").addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("pos_token");
      window.location.href = "login.html";
    });

    let allCategories = [];

    async function loadCategories() {
      const wrap = document.getElementById("categoriesTableWrap");
      try {
        const res = await fetch(`${API_BASE}/categories/`, { headers: authHeaders });
        if (!res.ok) throw new Error("Failed to load categories");
        const categories = await res.json();
        allCategories = categories;

        if (categories.length === 0) {
          wrap.innerHTML = `<p class="muted">No categories yet. Add your first one above.</p>`;
          return;
        }

        const rows = categories.map(c => `
          <tr>
            <td>${c.name}</td>
            <td>${c.description || '—'}</td>
            <td style="white-space:nowrap;">
              <button class="edit-btn" onclick="openEditModal(${c.id})">Edit</button>
              <button class="danger" onclick="deleteCategory(${c.id})">Delete</button>
            </td>
          </tr>
        `).join("");

        wrap.innerHTML = `
          <table>
            <thead>
              <tr><th>Name</th><th>Description</th><th>Actions</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } catch (err) {
        wrap.innerHTML = `<p class="error">Could not load categories: ${err.message}</p>`;
      }
    }

    document.getElementById("categoryForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const messageEl = document.getElementById("message");

      const payload = {
        name: document.getElementById("name").value,
        description: document.getElementById("description").value || null,
        is_active: true
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Adding...";
      messageEl.textContent = "";
      messageEl.className = "";

      try {
        const res = await fetch(`${API_BASE}/categories/`, {
          method: "POST",
          headers: authHeaders,
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to add category");

        messageEl.textContent = "Category added!";
        messageEl.className = "success";
        document.getElementById("categoryForm").reset();
        loadCategories();
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Add Category";
      }
    });

    async function deleteCategory(id) {
      if (!confirm("Delete this category? This cannot be undone.")) return;
      try {
        const res = await fetch(`${API_BASE}/categories/${id}`, {
          method: "DELETE",
          headers: authHeaders
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "Failed to delete category");
        }
        loadCategories();
      } catch (err) {
        alert(err.message);
      }
    }
    window.deleteCategory = deleteCategory;

    function openEditModal(id) {
      const category = allCategories.find(c => c.id === id);
      if (!category) return;

      document.getElementById("editId").value = category.id;
      document.getElementById("editName").value = category.name;
      document.getElementById("editDescription").value = category.description || "";
      document.getElementById("editMessage").textContent = "";

      document.getElementById("editModal").classList.add("open");
    }
    window.openEditModal = openEditModal;

    function closeEditModal() {
      document.getElementById("editModal").classList.remove("open");
    }
    window.closeEditModal = closeEditModal;

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("editId").value;
      const submitBtn = document.getElementById("editSubmitBtn");
      const messageEl = document.getElementById("editMessage");

      const payload = {
        name: document.getElementById("editName").value,
        description: document.getElementById("editDescription").value || null
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";
      messageEl.textContent = "";

      try {
        const res = await fetch(`${API_BASE}/categories/${id}`, {
          method: "PUT",
          headers: authHeaders,
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to update category");

        closeEditModal();
        loadCategories();
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Save Changes";
      }
    });

    loadCategories();
  </script>
</body>
</html>
