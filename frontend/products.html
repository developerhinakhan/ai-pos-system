<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS System — Products</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0F1E;
      color: #E8EDF5;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .container { max-width: 900px; margin: 0 auto; }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    nav a {
      color: #93A0B3;
      text-decoration: none;
      font-size: 0.85rem;
      padding: 0.5rem 0.9rem;
      border: 1px solid #1E2A3A;
      border-radius: 8px;
    }
    nav a:hover { color: #00D4FF; border-color: #00D4FF; }
    nav a.active { color: #00D4FF; border-color: #00D4FF; background: #00D4FF11; }

    h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }

    .card {
      background: #111827;
      border: 1px solid #1E2A3A;
      border-radius: 14px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: 1rem; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      font-size: 0.8rem;
      color: #93A0B3;
      margin-bottom: 0.35rem;
    }
    input, select {
      width: 100%;
      padding: 0.65rem;
      border-radius: 8px;
      border: 1px solid #1E2A3A;
      background: #0A0F1E;
      color: #E8EDF5;
      font-size: 0.9rem;
    }
    input:focus, select:focus { outline: none; border-color: #00D4FF; }

    button {
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      border: none;
      background: #00D4FF;
      color: #0A0F1E;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    table { width: 100%; border-collapse: collapse; }
    th, td {
      text-align: left;
      padding: 0.7rem 0.5rem;
      border-bottom: 1px solid #1E2A3A;
      font-size: 0.88rem;
    }
    th { color: #93A0B3; font-weight: 500; font-size: 0.78rem; text-transform: uppercase; }

    .low-stock { color: #FF6B6B; font-weight: 600; }
    .ok-stock { color: #00FF88; }

    .edit-btn {
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 6px;
      border: 1px solid #00D4FF;
      background: transparent;
      color: #00D4FF;
      cursor: pointer;
      margin-right: 0.4rem;
    }
    .edit-btn:hover { background: #00D4FF11; }
    .danger {
      background: transparent;
      border: 1px solid #FF6B6B;
      color: #FF6B6B;
      padding: 0.4rem 0.7rem;
      font-size: 0.8rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .danger:hover { background: #FF6B6B11; }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-box {
      background: #111827;
      border: 1px solid #1E2A3A;
      border-radius: 14px;
      padding: 1.75rem;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-box h2 { margin-bottom: 1rem; }
    .modal-actions {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }
    .modal-actions button.secondary {
      background: transparent;
      border: 1px solid #1E2A3A;
      color: #E8EDF5;
    }

    #message {
      margin-top: 0.75rem;
      font-size: 0.85rem;
    }
    .error { color: #FF6B6B; }
    .success { color: #00FF88; }
    .muted { color: #93A0B3; font-size: 0.85rem; padding: 1rem 0; }
  </style>
</head>
<body>
  <div class="container">
    <nav>
      <div style="font-weight:700;">POS System</div>
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
        <a href="products.html" class="active">Products</a>
        <a href="sale.html">Make Sale</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="#" id="logoutLink">Logout</a>
      </div>
    </nav>

    <h1>Products</h1>

    <div class="card">
      <h2>Add New Product</h2>
      <form id="productForm">
        <div class="form-grid">
          <div>
            <label>Name</label>
            <input type="text" id="name" required />
          </div>
          <div>
            <label>SKU</label>
            <input type="text" id="sku" required />
          </div>
          <div>
            <label>Price</label>
            <input type="number" step="0.01" id="price" required />
          </div>
          <div>
            <label>Stock Quantity</label>
            <input type="number" id="stock_quantity" required />
          </div>
          <div>
            <label>Low Stock Alert</label>
            <input type="number" id="low_stock_alert" required />
          </div>
          <div>
            <label>Category</label>
            <select id="category_id" required>
              <option value="">Loading...</option>
            </select>
          </div>
        </div>
        <button type="submit" id="submitBtn">Add Product</button>
        <div id="message"></div>
      </form>
    </div>

    <div class="card">
      <h2>Current Products</h2>
      <div id="productsTableWrap">
        <p class="muted">Loading products...</p>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal-box">
      <h2>Edit Product</h2>
      <form id="editForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div>
            <label>Name</label>
            <input type="text" id="editName" required />
          </div>
          <div>
            <label>SKU</label>
            <input type="text" id="editSku" required />
          </div>
          <div>
            <label>Price</label>
            <input type="number" step="0.01" id="editPrice" required />
          </div>
          <div>
            <label>Stock Quantity</label>
            <input type="number" id="editStockQuantity" required />
          </div>
          <div>
            <label>Low Stock Alert</label>
            <input type="number" id="editLowStockAlert" required />
          </div>
          <div>
            <label>Category</label>
            <select id="editCategoryId" required></select>
          </div>
        </div>
        <div id="editMessage" style="margin-bottom:0.75rem;"></div>
        <div class="modal-actions">
          <button type="submit" id="editSubmitBtn">Save Changes</button>
          <button type="button" class="secondary" onclick="closeEditModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = "https://ai-pos-system-production-8ee2.up.railway.app";
    const token = localStorage.getItem("pos_token");

    if (!token) {
      window.location.href = "login.html";
    }

    const authHeaders = {
      "Authorization": `Bearer ${token}`,
      "Content-Type": "application/json"
    };

    document.getElementById("logoutLink").addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("pos_token");
      window.location.href = "login.html";
    });

    async function loadCategories() {
      const select = document.getElementById("category_id");
      try {
        const res = await fetch(`${API_BASE}/categories/`, { headers: authHeaders });
        if (!res.ok) throw new Error("Failed to load categories");
        const categories = await res.json();

        if (categories.length === 0) {
          select.innerHTML = `<option value="">No categories yet — create one via /docs</option>`;
          return;
        }

        select.innerHTML = categories
          .map(c => `<option value="${c.id}">${c.name}</option>`)
          .join("");
      } catch (err) {
        select.innerHTML = `<option value="">Error loading categories</option>`;
      }
    }

    let allProducts = [];

    async function loadProducts() {
      const wrap = document.getElementById("productsTableWrap");
      try {
        const res = await fetch(`${API_BASE}/products/`, { headers: authHeaders });
        if (!res.ok) throw new Error("Failed to load products");
        const products = await res.json();
        allProducts = products;

        if (products.length === 0) {
          wrap.innerHTML = `<p class="muted">No products yet. Add your first one above.</p>`;
          return;
        }

        const rows = products.map(p => {
          const isLow = p.stock_quantity <= p.low_stock_alert;
          return `
            <tr>
              <td>${p.name}</td>
              <td>${p.sku}</td>
              <td>$${p.price.toFixed(2)}</td>
              <td class="${isLow ? 'low-stock' : 'ok-stock'}">${p.stock_quantity} ${isLow ? '⚠ Low' : ''}</td>
              <td style="white-space:nowrap;">
                <button class="edit-btn" onclick="openEditModal(${p.id})">Edit</button>
                <button class="danger" onclick="deleteProduct(${p.id})">Delete</button>
              </td>
            </tr>
          `;
        }).join("");

        wrap.innerHTML = `
          <table>
            <thead>
              <tr><th>Name</th><th>SKU</th><th>Price</th><th>Stock</th><th>Actions</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        `;
      } catch (err) {
        wrap.innerHTML = `<p class="error">Could not load products: ${err.message}</p>`;
      }
    }

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      const messageEl = document.getElementById("message");

      const payload = {
        name: document.getElementById("name").value,
        sku: document.getElementById("sku").value,
        price: parseFloat(document.getElementById("price").value),
        stock_quantity: parseInt(document.getElementById("stock_quantity").value),
        low_stock_alert: parseInt(document.getElementById("low_stock_alert").value),
        category_id: parseInt(document.getElementById("category_id").value)
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Adding...";
      messageEl.textContent = "";
      messageEl.className = "";

      try {
        const res = await fetch(`${API_BASE}/products/`, {
          method: "POST",
          headers: authHeaders,
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.detail || "Failed to add product");
        }

        messageEl.textContent = "Product added!";
        messageEl.className = "success";
        document.getElementById("productForm").reset();
        loadProducts();

      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Add Product";
      }
    });

    async function deleteProduct(id) {
      if (!confirm("Delete this product? This cannot be undone.")) return;
      try {
        const res = await fetch(`${API_BASE}/products/${id}`, {
          method: "DELETE",
          headers: authHeaders
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          throw new Error(data.detail || "Failed to delete product");
        }
        loadProducts();
      } catch (err) {
        alert(err.message);
      }
    }

    window.deleteProduct = deleteProduct;

    async function openEditModal(id) {
      const product = allProducts.find(p => p.id === id);
      if (!product) return;

      document.getElementById("editId").value = product.id;
      document.getElementById("editName").value = product.name;
      document.getElementById("editSku").value = product.sku;
      document.getElementById("editPrice").value = product.price;
      document.getElementById("editStockQuantity").value = product.stock_quantity;
      document.getElementById("editLowStockAlert").value = product.low_stock_alert;
      document.getElementById("editMessage").textContent = "";

      // populate category dropdown for the modal
      const editSelect = document.getElementById("editCategoryId");
      try {
        const res = await fetch(`${API_BASE}/categories/`, { headers: authHeaders });
        const categories = await res.json();
        editSelect.innerHTML = categories.map(c =>
          `<option value="${c.id}" ${c.id === product.category_id ? "selected" : ""}>${c.name}</option>`
        ).join("");
      } catch (err) {
        editSelect.innerHTML = `<option value="${product.category_id}">Current category</option>`;
      }

      document.getElementById("editModal").classList.add("open");
    }

    window.openEditModal = openEditModal;

    function closeEditModal() {
      document.getElementById("editModal").classList.remove("open");
    }
    window.closeEditModal = closeEditModal;

    document.getElementById("editForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("editId").value;
      const submitBtn = document.getElementById("editSubmitBtn");
      const messageEl = document.getElementById("editMessage");

      const payload = {
        name: document.getElementById("editName").value,
        sku: document.getElementById("editSku").value,
        price: parseFloat(document.getElementById("editPrice").value),
        stock_quantity: parseInt(document.getElementById("editStockQuantity").value),
        low_stock_alert: parseInt(document.getElementById("editLowStockAlert").value),
        category_id: parseInt(document.getElementById("editCategoryId").value)
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Saving...";
      messageEl.textContent = "";

      try {
        const res = await fetch(`${API_BASE}/products/${id}`, {
          method: "PUT",
          headers: authHeaders,
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Failed to update product");

        closeEditModal();
        loadProducts();
      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = "error";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Save Changes";
      }
    });

    loadCategories();
    loadProducts();
  </script>
</body>
</html>
