<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS System — Sign Up</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0F1E;
      color: #E8EDF5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .box {
      background: #111827;
      border: 1px solid #1E2A3A;
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.4rem; }
    .sub { color: #93A0B3; font-size: 0.9rem; margin-bottom: 1.75rem; }
    label {
      display: block;
      font-size: 0.85rem;
      color: #93A0B3;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #1E2A3A;
      background: #0A0F1E;
      color: #E8EDF5;
      font-size: 0.95rem;
      margin-bottom: 1.1rem;
    }
    input:focus { outline: none; border-color: #00D4FF; }
    button {
      width: 100%;
      padding: 0.8rem;
      border-radius: 8px;
      border: none;
      background: #00D4FF;
      color: #0A0F1E;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #message {
      margin-top: 1rem;
      font-size: 0.85rem;
      text-align: center;
      min-height: 1.2rem;
    }
    .error { color: #FF6B6B; }
    .success { color: #00FF88; }
    .switch-link {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.85rem;
      color: #93A0B3;
    }
    .switch-link a { color: #00D4FF; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Create Account</h1>
    <p class="sub">Set up your POS system</p>

    <form id="signupForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" />

      <label for="contact_no">Contact Number (optional)</label>
      <input type="text" id="contact_no" />

      <button type="submit" id="submitBtn">Sign Up</button>
    </form>

    <div id="message"></div>

    <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>
  </div>

  <script>
    const API_BASE = "https://ai-pos-system-production-8ee2.up.railway.app";

    const form = document.getElementById("signupForm");
    const messageEl = document.getElementById("message");
    const submitBtn = document.getElementById("submitBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const payload = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value,
        contact_no: document.getElementById("contact_no").value || null
      };

      submitBtn.disabled = true;
      submitBtn.textContent = "Creating account...";
      messageEl.textContent = "";
      messageEl.className = "";

      try {
        const response = await fetch(`${API_BASE}/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Signup failed");
        }

        localStorage.setItem("pos_token", data.access_token);

        messageEl.textContent = "Account created! Redirecting...";
        messageEl.className = "success";

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);

      } catch (err) {
        messageEl.textContent = err.message;
        messageEl.className = "error";
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign Up";
      }
    });
  </script>
</body>
</html>
